@media(min-width:700px){
.game{gap:10px}
.board-wrap{min-height:0}
.tile{border-radius:17px}
.tile-face{font-size:calc(var(--ts, 60px) * .55)}
}
@media(max-height:680px){
.logo-word{font-size:60px}
.menu-fruits{font-size:26px}
.menu-logo{margin-top:2vh}
.tray{grid-template-columns:repeat(7,minmax(34px,46px))}
.booster-bar{margin-top:0}
.board-wrap{transform:none!important;transform-origin:center}
}
@media(max-width:420px){
.board-wrap{margin-top:-4px}
.game{gap:5px}
.objectives{gap:5px}
.obj-chip{padding:3px 9px;font-size:12px}

/* YEJO — Tile Explorer inspired visual pass */
.game{
  background:
    radial-gradient(ellipse at 50% 18%,rgba(255,255,255,.12),transparent 42%),
    linear-gradient(180deg,#315c45 0%,#234736 48%,#18362b 100%);
}
.game .topbar{padding:4px 6px 0}
.game .topbar-title{color:#fff8df;text-shadow:0 2px 2px #0007}
.game .hud-box{
  background:linear-gradient(180deg,#fff8e633,#00000052);
  border:2px solid #fff8df55;
  box-shadow:inset 0 2px #fff8df22,0 3px 8px #0007;
}
.objectives{filter:drop-shadow(0 2px 2px #0006)}
.board-wrap{
  perspective:1100px;
}
.board{
  transform:rotateX(2deg);
  transform-style:preserve-3d;
  background:
    radial-gradient(ellipse at 50% 42%,#5e8a6840,transparent 65%),
    linear-gradient(145deg,#315b435c,#10271d80);
  border:8px solid #6e4b2e;
  box-shadow:
    inset 0 0 0 3px #d6a45b55,
    inset 0 0 35px #07150f99,
    0 12px 0 #3c2819,
    0 22px 45px #0009;
}
.tile{
  border-radius:18px;
  transform-style:preserve-3d;
  border:2px solid #fff9d988;
  box-shadow:
    inset 0 3px 0 #ffffff80,
    inset 0 -7px 0 #00000035,
    0 5px 0 #00000035,
    0 8px 12px #0008;
}
.tile::after{
  content:"";
  position:absolute;
  left:6px;right:6px;bottom:-6px;height:8px;
  border-radius:0 0 12px 12px;
  background:#00000032;
  transform:translateZ(-8px);
  pointer-events:none;
}
.tile-face{
  filter:drop-shadow(0 3px 2px #0008);
  transform:translateZ(5px);
}
.fruit.f0{background:linear-gradient(145deg,#ff8b8b 0%,#e52e39 45%,#a9141d 100%)}
.fruit.f1{background:linear-gradient(145deg,#ff7fa8 0%,#df2d72 45%,#8e1647 100%)}
.fruit.f2{background:linear-gradient(145deg,#ffd071 0%,#f27c16 48%,#b94b00 100%)}
.fruit.f3{background:linear-gradient(145deg,#fff78b 0%,#ffd52d 48%,#c88c00 100%)}
.fruit.f4{background:linear-gradient(145deg,#a7e7a8 0%,#4cae57 48%,#226d30 100%)}
.fruit.f5{background:linear-gradient(145deg,#d8c8ff 0%,#8059ca 48%,#45257f 100%)}
.fruit.f6{background:linear-gradient(145deg,#ff9b9b 0%,#d94444 48%,#8f2020 100%)}
.yejo{
  background:linear-gradient(145deg,#39415d,#171a2c 52%,#0b0d18);
  box-shadow:
    inset 0 3px #ffffff55,
    0 0 16px #ffd54f80,
    0 5px 0 #0007,
    0 9px 14px #0009;
}
.tray-wrap{
  position:relative;
  padding:10px 0 8px;
}
.tray-wrap::before{
  content:"";
  position:absolute;
  left:50%;bottom:5px;
  width:min(94vw,560px);height:82px;
  transform:translateX(-50%);
  border-radius:22px;
  background:linear-gradient(180deg,#a86d36,#70421f 55%,#4a2b18);
  border:5px solid #c28a4e;
  box-shadow:inset 0 4px #f1c17b55,0 8px 18px #0008;
  z-index:0;
}
.tray{
  position:relative;
  z-index:1;
  background:linear-gradient(180deg,#3b2415aa,#1d100a99);
  border:2px solid #e0ad6c88;
  border-radius:17px;
  box-shadow:inset 0 3px #fff0,0 4px 10px #0008;
}
.slot{
  background:#fff8df16;
  border:2px solid #e8c38c44;
  box-shadow:inset 0 2px #fff8df22;
}
.slot .tile{
  border-radius:11px;
}
.booster-bar{
  position:relative;
  z-index:2;
}
.booster{
  background:linear-gradient(180deg,#ffffff25,#00000055);
  border-color:#fff3d455;
  box-shadow:inset 0 2px #fff7,0 5px 0 #0005;
}

/* === FINAL TILE-EXPLORER STYLE PASS === */
.game{
